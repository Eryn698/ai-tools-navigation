<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI工具导航</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
}
</script>
<style>
  [v-cloak] { display: none; }
</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
<div id="app" v-cloak>
  <div :class="isDark ? 'dark' : ''">
    <div class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
      <!-- 导航栏 -->
      <nav class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center justify-between">
              <h1 class="text-2xl font-bold text-gray-900 dark:text-white">🤖 AI工具导航</h1>
              <button @click="isDark = !isDark" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition text-lg">
                {{ isDark ? '☀️' : '🌙' }}
              </button>
            </div>
            <div class="flex-1 sm:max-w-md">
              <input v-model="search" type="text" placeholder="搜索AI工具..."
                class="w-full px-4 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
            </div>
          </div>
        </div>
      </nav>

      <!-- 分类筛选 -->
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex flex-wrap gap-2 mb-6">
          <button v-for="cat in categories" :key="cat" @click="selectedCategory = cat"
            :class="['px-4 py-2 rounded-full text-sm font-medium transition-all duration-200',
              selectedCategory === cat ? 'bg-blue-600 text-white shadow-md scale-105' : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600 hover:border-blue-400']">
            {{ cat }}
          </button>
        </div>

        <!-- 加载中 -->
        <div v-if="loading" class="text-center py-20 text-gray-400 text-lg">加载中...</div>

        <!-- 工具卡片 -->
        <div v-else class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <a v-for="tool in filteredTools" :key="tool.id" :href="tool.url" target="_blank" rel="noopener noreferrer"
            class="block p-6 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-lg hover:border-blue-300 dark:hover:border-blue-600 hover:-translate-y-1 transition-all duration-200">
            <div class="flex items-start gap-4 mb-3">
              <div class="text-4xl">{{ tool.icon }}</div>
              <div class="flex-1">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">{{ tool.name }}</h3>
                <span class="inline-block mt-1 px-2 py-1 text-xs font-medium bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 rounded">{{ tool.category }}</span>
              </div>
            </div>
            <p class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed">{{ tool.description }}</p>
          </a>
        </div>

        <!-- 无结果 -->
        <div v-if="!loading && filteredTools.length === 0" class="text-center py-12 text-gray-500 dark:text-gray-400 text-lg">没有找到匹配的AI工具 😅</div>
      </div>

      <!-- 页脚 -->
      <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
          <p class="text-center text-gray-500 dark:text-gray-400 text-sm">© 2026 AI工具导航 | 收录优质AI工具，提升工作效率 🚀</p>
        </div>
      </footer>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, computed, onMounted } = Vue;

createApp({
  setup() {
    const isDark = ref(false);
    const search = ref('');
    const selectedCategory = ref('全部');
    const tools = ref([]);
    const loading = ref(true);

    const categories = computed(() => ['全部', ...new Set(tools.value.map(t => t.category))]);

    const filteredTools = computed(() => {
      return tools.value.filter(tool => {
        const q = search.value.toLowerCase();
        const matchSearch = !q || tool.name.toLowerCase().includes(q) || tool.description.toLowerCase().includes(q) || tool.category.toLowerCase().includes(q);
        const matchCat = selectedCategory.value === '全部' || tool.category === selectedCategory.value;
        return matchSearch && matchCat;
      });
    });

    onMounted(async () => {
      try {
        const res = await fetch('/api/tools');
        const data = await res.json();
        if (data.success) tools.value = data.data;
      } catch (e) {
        console.error('加载失败', e);
      }
      loading.value = false;
    });

    return { isDark, search, selectedCategory, tools, loading, categories, filteredTools };
  }
}).mount('#app');
</script>
</body>
</html>
